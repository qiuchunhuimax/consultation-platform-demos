<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超非凡 · 业务协同原型 v0.4</title>
<style>
:root{
  --blue:#0f766e;--blue-hover:#0d8a80;--blue-active:#115e59;--blue-tint:#e3f3f1;--blue-tint-strong:#c9e9e4;
  --ink:#1d1d1f;--ink-2:#37373a;--muted:#6e6e73;--muted-2:#86868b;
  --line:#e5e5ea;--line-2:#d5d5da;--field:#f2f2f4;
  --bg:#f3f6f5;--surface:#ffffff;--sidebar:#eef5f3;
  --green:#1c7a3d;--green-bg:#e4f8ea;--orange:#a9640a;--orange-bg:#fef1de;--red:#d70015;--red-bg:#ffebe9;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
  --shadow-1:0 1px 2px rgba(0,0,0,.05);--shadow-2:0 2px 10px rgba(0,0,0,.06);--shadow-3:0 16px 40px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:9px 16px;font-weight:500;transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .05s ease}
button:hover{border-color:#b9b9be;background:#fafafa}
button:active{transform:scale(.98)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(15,118,110,.22)}
.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:590}
.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:#fff}
.primary:active{background:var(--blue-active)}
.link{color:var(--blue);border:0;background:none;padding:5px;font-weight:500}
.link:hover{background:none;border:0;color:var(--blue-hover);text-decoration:underline}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.1px}
.small{font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--field);color:var(--muted)}
.badge.blue{background:var(--blue-tint);color:var(--blue)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.orange{background:var(--orange-bg);color:var(--orange)}
.badge.red{background:var(--red-bg);color:var(--red)}
.dot{width:6px;height:6px;background:currentColor;border-radius:50%}

aside{width:208px;background:var(--sidebar);position:fixed;inset:0 auto 0 0;color:var(--muted);padding:26px 14px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);padding:0 8px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(180deg,#14a394,#0b5f58);display:grid;place-items:center;color:white;font-size:18px;font-weight:700;box-shadow:0 2px 6px rgba(0,98,196,.35)}
.brand b{font-size:17px;letter-spacing:-.2px;font-weight:600}
.brand small{display:block;font-size:10px;color:var(--muted-2);margin-top:2px;letter-spacing:.2px}
.navtitle{font-size:11px;color:var(--muted-2);letter-spacing:.6px;margin:36px 12px 10px;font-weight:600;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;background:transparent;border:0;color:#4b4b4e;padding:10px 12px;display:flex;align-items:center;gap:11px;border-radius:9px;font-weight:500}
.nav button:hover{background:#efeff1;border:0}
.nav button.active{background:var(--blue-tint);color:var(--blue)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;flex-shrink:0}
.nav .n{margin-left:auto;font-size:10px;opacity:.55}
.sidebarfoot{margin-top:auto;border-top:1px solid var(--line);padding:20px 12px 0;font-size:11.5px;line-height:1.8;color:var(--muted-2)}
.sidebarfoot strong{color:var(--ink-2);font-weight:600}

.main{margin-left:208px}
.topbar{height:70px;background:rgba(251,251,253,.85);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);padding:0 34px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar .right{display:flex;align-items:center;gap:16px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-tint);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:12px}
.crumb{color:var(--muted-2);font-size:12.5px}
.crumb span{color:var(--ink-2);margin-left:8px;font-weight:500}
main{padding:30px 34px 26px;max-width:1800px;margin:auto}
.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:20px}
.eyebrow{font-size:11px;letter-spacing:1.2px;font-weight:650;color:var(--blue);margin-bottom:8px;text-transform:uppercase}
h1{font-size:28px;margin:0 0 8px;letter-spacing:-.4px;font-weight:650}
p{margin:0;line-height:1.65}
.heading p{color:var(--muted);font-size:13.5px;max-width:60ch}
.actions{display:flex;gap:10px;align-items:center;flex-shrink:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-1)}
.stat label{color:var(--muted);font-size:12px;font-weight:500}
.stat strong{display:block;font-size:30px;line-height:1.5;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:var(--ink)}
.stat span{font-size:11.5px;color:var(--muted-2)}
.stat strong em{font-size:12px;font-style:normal;color:var(--muted-2);font-weight:400;margin-left:6px;letter-spacing:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-1)}
.cardhead{display:flex;align-items:center;justify-content:space-between;padding:19px 22px;border-bottom:1px solid var(--line)}
h2{font-size:16px;margin:0;font-weight:620;letter-spacing:-.1px}
.cardhead small{font-size:11.5px;color:var(--muted-2)}
.filters{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.filters input{min-width:250px}
.filters input,.filters select,input,textarea{border:1px solid transparent;border-radius:var(--r-sm);padding:9px 13px;background:var(--field);color:var(--ink-2)}
.filters input:focus,.filters select:focus,input:focus,textarea:focus{background:var(--surface);border-color:var(--blue);outline:none}
.filters .note{margin-left:auto;font-size:11.5px;color:var(--muted-2)}
table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}
th{background:#fafafc;font-size:11px;font-weight:600;color:var(--muted);padding:13px 15px;letter-spacing:.2px}
td{padding:16px 15px;border-bottom:1px solid #f0f0f2;font-size:12.5px}
td:first-child,th:first-child{padding-left:22px}
td:last-child,th:last-child{padding-right:22px}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .12s ease}
tbody tr:hover{background:#fafbfd}
td strong{font-size:12.5px;font-weight:560;display:block;color:var(--ink-2)}
td small{display:block;color:var(--muted-2);font-size:10.5px;margin-top:4px}
.tablewrap{overflow:auto}
.tablefoot{display:flex;justify-content:space-between;align-items:center;padding:15px 22px;border-top:1px solid var(--line);color:var(--muted-2);font-size:11.5px}
.pagepill{display:inline-block;padding:4px 10px;background:var(--blue-tint);border:1px solid var(--blue-tint-strong);color:var(--blue);border-radius:99px;font-weight:600}
.bottom{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted-2);margin-top:18px}
.callout{background:var(--blue-tint);color:#0b5f58;border:1px solid var(--blue-tint-strong);border-radius:var(--r-md);padding:12px 16px;font-size:12.5px;margin-bottom:18px}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.tabs{display:flex;gap:26px}
.tab{border:0;background:none;border-radius:0;padding:4px 0 13px;color:var(--muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent}
.tab:hover{background:none;border-color:transparent;color:var(--ink-2)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.moneygrid{display:grid;grid-template-columns:repeat(3,1fr);padding:22px 23px;gap:20px;background:#fafbfd}
.moneygrid>div{border-right:1px solid var(--line)}
.moneygrid>div:last-child{border:0}
.moneygrid label{display:block;color:var(--muted);font-size:11.5px;margin-bottom:9px;font-weight:500}
.moneygrid b{font-size:24px;font-weight:650;letter-spacing:-.3px}
.moneygrid small{display:block;color:var(--muted-2);font-size:10.5px;margin-top:7px}
.sectiongap{margin-top:20px}
.mailrow{display:flex;gap:13px;padding:19px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .12s ease}
.mailrow:hover,.mailrow.selected{background:var(--blue-tint)}
.mailicon{width:34px;height:34px;flex-shrink:0;background:var(--field);border-radius:9px;display:grid;place-items:center;color:#5b7fb5;font-size:14px}
.mailrow.selected .mailicon{background:#fff;color:var(--blue)}
.mailbody{flex:1;min-width:0}
.mailbody header{display:flex;justify-content:space-between;margin-bottom:7px;gap:10px}
.mailbody b{font-weight:590;font-size:13px}
.mailbody p{font-size:12px;color:var(--muted);margin-bottom:9px}
.mailbody footer{display:flex;justify-content:space-between;align-items:center}
.mailbody time{font-size:10px;color:var(--muted-2)}
.case{padding:22px}
.case h3{font-size:18px;margin:15px 0 11px;font-weight:640;letter-spacing:-.2px}
.case p{font-size:12.5px;color:var(--muted)}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0;padding:17px;background:#fafbfd;border-radius:var(--r-md)}
.kvgrid label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px;font-weight:500}
.kvgrid strong{font-size:12.5px;font-weight:560;color:var(--ink-2)}
.timeline{margin:20px 0}
.event{border-left:1px solid var(--line-2);margin-left:5px;padding:0 0 23px 21px;position:relative}
.event:before{content:'';width:8px;height:8px;background:#c6cbd3;border:3px solid var(--surface);border-radius:50%;position:absolute;left:-7px;top:1px}
.event:first-child:before{background:var(--blue)}
.event b{display:block;font-size:12.5px;font-weight:590;margin-bottom:6px;color:var(--ink-2)}
.event small{color:var(--muted-2);font-size:10px}
.event p{font-size:12.5px;margin-bottom:6px;color:var(--muted)}
.event:last-child{padding-bottom:0}
.casebar{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.modalback{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:30;display:none;justify-content:flex-end}
.modalback.open{display:flex}
.drawer{background:var(--surface);width:540px;height:100%;overflow:auto;box-shadow:-10px 0 50px rgba(14,34,69,.14);padding:28px}
.drawerhead{display:flex;align-items:center;justify-content:space-between}
.drawer h3{font-size:17px;margin:25px 0 15px;font-weight:620}
.drawer .kvgrid{grid-template-columns:1fr 1fr}
.drawer form{display:grid;gap:14px}
.drawer form label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:500}
.drawer form input,.drawer textarea{width:100%}
.drawer textarea{min-height:95px;resize:vertical}
.app-shell.demo-on .drawer{padding-bottom:300px}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap}
.lv i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lv-g{background:#e8f6ec;color:#1f7a3a}.lv-g i{background:#34c759}
.lv-y{background:#fff5dc;color:#8a5a00}.lv-y i{background:#ffb800;box-shadow:0 0 0 3px rgba(255,184,0,.22)}
.lv-r{background:#fdecea;color:#b3261e}.lv-r i{background:#ff3b30;box-shadow:0 0 0 3px rgba(255,59,48,.2);animation:lvpulse 1.6s infinite}
@keyframes lvpulse{50%{box-shadow:0 0 0 6px rgba(255,59,48,.05)}}
.lvline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
td .lv+small{display:block;margin-top:5px}
.usebar{display:flex;align-items:center;gap:10px;min-width:150px}
.usebar span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.usetrack{position:relative;flex:1;height:8px;border-radius:99px;background:rgba(120,130,150,.16);min-width:80px}
.usetrack i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#34c759}
.usetrack em{position:absolute;left:85%;top:-3px;bottom:-3px;width:2px;background:rgba(40,40,50,.35);border-radius:2px}
.lv-y .usetrack i{background:#ffb800}.lv-r .usetrack i{background:#ff3b30}
tr.lvrow-red td{background:rgba(255,59,48,.045)}tr.lvrow-yellow td{background:rgba(255,184,0,.06)}
.warnrule{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
.acctbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 1.6fr;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line);align-items:center}
.acctbox label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.acctbox b{font-size:17px;font-variant-numeric:tabular-nums}
.acctbox.lvrow-red{background:rgba(255,59,48,.045)}.acctbox.lvrow-yellow{background:rgba(255,184,0,.06)}
.acctwarn{display:grid;gap:8px}
.acctmini{display:grid;gap:8px;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.ccmail .kvgrid{margin:0}
.ccmail{margin-top:16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.todo-ico.warnico{background:var(--orange-bg);color:#8a4d00}
.danger-btn{background:#fdecea;color:#b3261e;border-color:#f6cdc8}
@container (max-width:720px){table tr.lvrow-yellow{background:#fffaf0}table tr.lvrow-red{background:#fff6f5}tr.lvrow-red td,tr.lvrow-yellow td{background:transparent}.acctbox{grid-template-columns:1fr 1fr}.acctbox .acctwarn{grid-column:1/-1}.warnrule{padding:12px 16px}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:13px 22px;background:rgba(29,29,31,.92);backdrop-filter:blur(10px);color:white;box-shadow:0 8px 30px rgba(0,0,0,.25);border-radius:12px;z-index:45;display:none;font-size:13px;font-weight:500}
.emptystate{padding:40px;text-align:center;color:var(--muted-2)}

/* Dashboard: aggregated panels (desktop workbench view) */
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.panel{padding:22px}
.panel h2{margin-bottom:4px}
.panel .panelsub{font-size:11.5px;color:var(--muted-2);margin-bottom:18px}
.progress-seg{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--field)}
.seg{height:100%}
.seg:not(:last-child){border-right:2px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:14px 18px;margin-top:14px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.legend-item .dot{width:8px;height:8px}
.legend-item b{font-weight:600;color:var(--ink)}
.legend-item small{color:var(--muted-2)}
.ring-row{display:flex;align-items:center;gap:24px}
.ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0}
.ring-wrap svg{width:100%;height:100%}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-text strong{font-size:21px;font-weight:650;letter-spacing:-.3px;color:var(--ink)}
.ring-text span{font-size:10px;color:var(--muted-2);margin-top:2px}
.minibars{display:flex;align-items:flex-end;gap:12px;min-height:76px;margin-top:6px}
.minibar-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.minibar{width:100%;max-width:30px;background:linear-gradient(180deg,#14a394,#0b5f58);border-radius:6px 6px 3px 3px}
.minibar-col span{font-size:10px;color:var(--muted-2);white-space:nowrap}
.orgbar-row{margin-bottom:14px}
.orgbar-row:last-child{margin-bottom:0}
.orgbar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;color:var(--ink-2)}
.orgbar-label b{font-weight:600;color:var(--ink)}
.orgbar-track{height:8px;background:var(--field);border-radius:5px;overflow:hidden}
.orgbar-fill{height:100%;background:var(--blue);border-radius:5px}
.agenda-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .12s ease}
.agenda-row:last-child{border-bottom:0}
.agenda-row:hover{background:#fafbfd}
.agenda-date{width:56px;text-align:center;flex-shrink:0}
.agenda-date strong{display:block;font-size:15px;font-weight:650;color:var(--ink)}
.agenda-date span{font-size:10px;color:var(--muted-2)}
.agenda-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.agenda-body b{font-size:12.5px;font-weight:560;color:var(--ink-2)}
.preview-mobile .web-only{display:none}

/* Profile ("我的") */
.profile-card{display:flex;align-items:center;gap:16px;padding:24px 22px}
.profile-avatar{width:56px;height:56px;border-radius:50%;background:var(--blue-tint);color:var(--blue);display:grid;place-items:center;font-size:22px;font-weight:650;flex-shrink:0}
.profile-info{display:flex;flex-direction:column;gap:6px}
.profile-info b{font-size:16.5px;font-weight:640;color:var(--ink);letter-spacing:-.1px}
.profile-info span{font-size:12.5px;color:var(--muted)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .12s ease}
.settings-row:last-child{border-bottom:0}
.settings-row:hover{background:#fafbfd}
.settings-row .label{font-size:13px;color:var(--ink-2);font-weight:500}
.settings-row .value{display:flex;align-items:center;gap:8px;color:var(--muted-2);font-size:12.5px}
.settings-row.danger .label{color:var(--red)}
.chev{color:var(--line-2);font-size:19px;line-height:1;font-weight:400}

/* Order table + detail: mail & payment tie-ins */
.cellhint{margin-top:7px;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--muted-2);white-space:normal}
.cellhint span{display:flex;align-items:center;gap:5px}
.agenda-tags{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:2px}
.agenda-tags .legend-item{font-size:10.5px}
.todo-list{margin:0 0 22px}
.todo-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:10px;background:#fafbfd}
.todo-row:last-child{margin-bottom:0}
.todo-row>button{white-space:nowrap;flex-shrink:0}
.todo-main{display:flex;align-items:center;gap:12px;min-width:0}
.todo-ico{width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:14px;color:var(--ink-2)}
.todo-ico.muted{color:var(--muted-2)}
.todo-main>div{min-width:0}
.todo-main b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:560;color:var(--ink-2)}
.todo-main span.muted{display:block;margin-top:4px}

/* Process flow step bar (与瑞金广慈的合作流程) */
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:500;white-space:nowrap;line-height:1.6}
.p-gc{background:#e7ebf4;color:#1f3a78}
.p-cf{background:var(--blue-tint);color:var(--blue)}
.p-os{background:#e1f4f9;color:#0b6680}
.s-sync{border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.s-mail{border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.s-manual{background:var(--orange-bg);color:var(--orange)}
.flow-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:14px}
.flow-legend .small{margin-right:8px;font-size:11px}
.flowstage{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:10px;background:var(--surface);overflow:hidden}

function tracker(o){const idx=statusIdx(o);if(isExc(o))return `<div class="wz-steps tracker">${STATUSES.map((s,i)=>`<span class="${i<=(o.gcAt?2:o.mailAt?1:0)?'done':''}"><i>${i+1}</i>${s}</span>`).join('')}<span class="exc"><i>!</i>${o.status}</span></div>`;
  return `<div class="wz-steps tracker">${STATUSES.map((s,i)=>`<span class="${i<idx||(i===idx&&s==='已完成')?'done':i===idx?'on':''}"><i>${i<idx||(i===idx&&s==='已完成')?'✓':i+1}</i>${s}</span>`).join('<b class="tk-arrow">›</b>')}</div>`}
function flowStages(o){const idx=statusIdx(o);return stages(o).map((s,si)=>{const dn=s.items.filter(it=>it.done).length,complete=dn===s.items.length;const na=nextAction(o);
  const body=s.items.map(it=>{const isNext=na&&(na.k===it.k||(na.k==='fee'&&(it.k==='fee'||it.k==='info')));const stop=isExc(o)&&!it.done;
    const state=it.done?'done':stop?'stopped':isNext?'next':'todo';
    let extra='';
    if(it.done&&it.at)extra+=`<span class="small muted">${stamp(it.at)}</span>`;
    if(it.k==='mail'&&o.mailAt)extra+=`<button class="link step-btn" onclick="showMail('${o.id}','ask')">查看邮件</button>`;
    if(it.k==='gc'&&o.gcAt)extra+=`<button class="link step-btn" onclick="showMail('${o.id}','cc')">查看抄送邮件</button>`;
    if(isNext&&!stop){if(na.perm){extra+=canDo(na,o)?`<button class="${na.blk?'danger-btn':'primary'} step-btn" onclick="${na.go}">${na.blk?'余额不足 · 查看':na.label}</button>`:denied(na.perm)}else extra+=`<button class="link step-btn" onclick="${na.go}">${na.btn||'模拟'+na.wait+'（演示）'}</button>`}
    const tip=it.done?'已完成':stop?'已终止':isNext?(na.perm?'待处理 · '+actorText(na):'等待'+na.wait):'未开始';
    return `<div class="step ${state}" data-k="${it.k}"><div class="step-dot">${it.done?'✓':''}</div><div class="step-body"><div class="step-head"><b>${it.t}</b></div><div class="step-sub">${it.sub}</div><div class="step-foot"><span class="chip ${SRC[it.src][1]}">${SRC[it.src][0]}</span><span class="small ${it.done||stop?'muted':isNext?'waittext':'muted'}">${tip}</span>${extra}</div></div></div>`}).join('');
  const cur=!isExc(o)&&si===idx&&!complete;
  return `<details class="flowstage ${complete?'complete':''}" ${cur||(!complete&&si<=idx+1)?'open':''}><summary><span class="stg-no">${complete?'✓':si+1}</span>${s.status}<span class="stg-title">${s.title}</span><span class="stg-meta">${dn}/${s.items.length}<span class="caret">›</span></span></summary><div class="flowbody">${body}</div></details>`}).join('')}

function mailCard(m){return `<div class="ccmail"><div class="kvgrid"><div><label>发件人</label><strong>${m.from}</strong></div><div><label>收件人</label><strong>${m.to}</strong></div></div><p style="margin-top:14px"><b>${esc(m.title)}</b></p><p style="margin-top:8px">${esc(m.text)}</p></div>`}

  <form onsubmit="event.preventDefault();doNsRefund('${id}')"><h3>退回诊所 CAD 预付</h3><label>退款比例（%）<input id="nsCad" type="number" min="0" max="100" step="1" required placeholder="如：50" oninput="nsCalc()"></label><div class="casebar" style="margin-top:8px">${[0,50,100].map(p=>`<button type="button" onclick="nsSet('nsCad',${p})">${p}%</button>`).join('')}</div><p class="small muted" id="nsCadAmt">已扣 CAD ${fmt(CAD_FEE)}</p>
  ${hasCny?`<h3>医院退回超非凡 CNY</h3><label>退款比例（%）<input id="nsCny" type="number" min="0" max="100" step="1" required placeholder="如：50" oninput="nsCalc()"></label><div class="casebar" style="margin-top:8px">${[0,50,100].map(p=>`<button type="button" onclick="nsSet('nsCny',${p})">${p}%</button>`).join('')}</div><p class="small muted" id="nsCnyAmt">已付 CNY ${fmt(cnyFeeOf(o))}</p>`:NS_SETTLE?`<h3>医院预约费用 · 资金池结算</h3><p class="small muted">会诊未发生，医院预约费用尚未结算；按与医院确认的比例从资金池结算，0% 即不结算。</p><label>结算比例（%）<input id="nsCny" type="number" min="0" max="100" step="1" required placeholder="如：0" oninput="nsCalc()"></label><div class="casebar" style="margin-top:8px">${[0,50,100].map(p=>`<button type="button" onclick="nsSet('nsCny',${p})">${p}%</button>`).join('')}</div><p class="small muted" id="nsCnyAmt">应结算 ${dual('CNY',cnyFeeOf(o))}</p>`:'<p class="small muted" style="margin-top:14px">该订单无医院预约费用需要处理。</p>'}
  <label>确认依据<textarea required placeholder="如：与医院、诊所沟通结果"></textarea></label><button class="primary" id="nsGo">确认退款比例（演示）</button><button type="button" onclick="detail('${id}')">返回订单详情</button></form>`)}
const nsPct=id=>{const e=document.getElementById(id);return e?Math.min(Math.max(Number(e.value)||0,0),100):null};
function nsSet(id,p){document.getElementById(id).value=p;nsCalc()}
function nsCalc(){const a=nsPct('nsCad'),n=nsPct('nsCny'),ea=document.getElementById('nsCadAmt'),en=document.getElementById('nsCnyAmt');
  const T=x=>lang==='en'?trText(x):x;if(ea)ea.textContent=T(`退回 CAD ${fmt(CAD_FEE*a/100)}，扣留 CAD ${fmt(CAD_FEE*(100-a)/100)}`);if(en)en.textContent=T(NS_SETTLE?`结算 ${dual('CNY',NS_FEE*n/100)}`:`退回 CNY ${fmt(NS_FEE*n/100)}，扣留 CNY ${fmt(NS_FEE*(100-n)/100)}`)}
function doNsRefund(id){const o=orderOf(id),pc=nsPct('nsCad'),pn=nsPct('nsCny'),note=noteVal();
  if(o.cad==='待退回'){o.cadPct=pc;o.cad=pc>=100?'已退回':pc>0?'部分退回':'已扣费'}
  if(o.cny==='待退回'){o.cnyPct=pn;o.cny=pn>=100?'已退回':pn>0?'部分退回':'已扣费'}
  else if(o.cny==='待扣费'&&pn!=null){o.cnyPct=pn;o.cny=pn>=100?'已扣费':pn>0?'部分结算':'无需结算';if(pn>0)o.payAt=nowStr().slice(5)}
  o.refund={state:'已处理',at:nowStr().slice(5),cadPct:pc,cnyPct:pn};
  gcWrite(o,b=>{b.refund={cadPct:pc,cnyPct:pn==null?0:pn};busFeed(['rj'],'api','超非凡','爽约退款 / 结算比例（人工确认）',`${b.cr||b.id} · 退回机构 CAD ${pc}%：${dual('CAD',CAD_FEE*pc/100)} · 医院预约费用结算 ${pn==null?0:pn}%：${dual('CNY',cnyFeeOf(o)*(pn||0)/100)}`,b.id)});
  logEvent('确认爽约退款',id,`退回诊所 CAD ${pc}%（CAD ${fmt(CAD_FEE*pc/100)}）${pn!=null?`；医院预约费用结算 ${pn}%（CNY ${fmt(cnyFeeOf(o)*pn/100)}）`:''} · ${note}`);
  logs.push({t:nowStr(),who:'系统自动',role:'系统',act:'退款与结算比例已通知医院',target:id,note:`退回诊所 CAD ${pc}%：${dual('CAD',CAD_FEE*pc/100)}${pn!=null?`；医院预约费用结算 ${pn}%：${dual('CNY',cnyFeeOf(o)*pn/100)}`:''}`});
  after(id,'爽约退款比例已确认，预付余额已更新（演示）')}
function doRefund(id,cur){const o=orderOf(id);o[cur]='已退回';if(cur==='cad')gcWrite(o,b=>{b.cadRefundAt=busNow();busFeed(['org:'+b.org,'rj'],'api','超非凡','挂号协诊费已全额退回',`${b.cr||b.id} · CAD ${fmt(CAD_FEE)} 退回机构预付`,b.id)});logEvent('确认退回挂号协诊费',id,noteVal());after(id,'费用已退回诊所 CAD 预付，已记入操作记录（演示）')}

/* ========= 预付与预警 ========= */
function orgBalance(g){return g.cadPrepaid-(g.cadHist||0)-orders.filter(o=>o.org===g.name).reduce((t,o)=>t+usedOf(o,'cad'),0)}
function cnyTotal(){return cnyPrepaid.reduce((s,p)=>s+p.amount,0)}
function cnyBalance(){return cnyTotal()-CNY_HIST-orders.reduce((t,o)=>t+usedOf(o,'cny'),0)}
/* 预付预警：使用率 = 已扣 ÷ 预付总额；≥85% 黄灯；达到 100% 或待扣超出余额 红灯；余额不足一单时禁止扣费 */
let WARN_Y=85;
function acct(pre,used,pend,fee){const pct=pre>0?used/pre*100:(used>0?100:0),bal=pre-used;const lv=(pct>=100||used+pend>pre)?'red':pct>=WARN_Y?'yellow':'green';return {pre,used,pend,bal,pct,lv,fee,canDeduct:bal>=fee}}
function acctCad(g){return acct(g.cadPrepaid,g.cadPrepaid-orgBalance(g),orders.filter(o=>o.org===g.name&&o.cad==='待扣费'&&o.status==='已发起').length*CAD_FEE,CAD_FEE)}
function acctCny(x){const pre=cnyTotal();return acct(pre,pre-cnyBalance(),orders.filter(o=>o.cny==='待扣费'&&['已确认','已完成'].includes(o.status)).reduce((t,o)=>t+cnyFeeOf(o),0),x?cnyFeeOf(x):CNY_FEE)}
function acctOf(o,cur){return cur==='cad'?acctCad(orgOf(o.org)):acctCny(o)}
const LV={green:['使用正常','lv-g'],yellow:['黄灯预警','lv-y'],red:['红灯预警','lv-r']};
function pctTxt(a){return (Math.floor(a.pct*10)/10).toFixed(1)+'%'}
function light(a){return `<span class="lv ${LV[a.lv][1]}"><i></i>${LV[a.lv][0]}</span>`}
function usebar(a){return `<div class="usebar ${LV[a.lv][1]}"><div class="usetrack"><i style="width:${Math.min(a.pct,100)}%"></i><em title="85%"></em></div><span>已用 ${pctTxt(a)}</span></div>`}
function lvReason(a,unit){if(a.lv==='red')return a.pct>=100?'预付已用完，暂停扣费，请先补款':`待扣 ${unit} ${fmt(a.pend)} 超出余额，余额不足的订单暂停扣费`;if(a.lv==='yellow')return `已用 ${pctTxt(a)}，请提醒补充预付`;return `已用 ${pctTxt(a)}`}
function lvCount(){const L=orgs.map(acctCad);return {y:L.filter(a=>a.lv==='yellow').length,r:L.filter(a=>a.lv==='red').length}}
function lvChips(){const c=lvCount();return (c.r?`<span class="lv lv-r"><i></i>红灯 ${c.r} 家</span>`:'')+(c.y?`<span class="lv lv-y"><i></i>黄灯 ${c.y} 家</span>`:'')+(!c.r&&!c.y?'<span class="lv lv-g"><i></i>使用正常</span>':'')}
function afterDeduct(o,cur){const a=acctOf(o,cur),unit=cur==='cad'?'CAD':'CNY',n=acct(a.pre,a.used+a.fee,Math.max(a.pend-a.fee,0),a.fee);return `<div class="acctmini ${n.lv==='green'?'':n.lv==='yellow'?'callout warn':'callout danger'}"><div class="small">${cur==='cad'?o.org+' CAD 预付':'超非凡 CNY 资金池'} · 扣费后余额 ${unit} ${fmt(n.bal)}</div>${usebar(n)}<div>${light(n)} <span class="small">${n.lv==='green'?'扣费后使用正常':n.lv==='yellow'?'扣费后达到黄灯预警线，请提醒补充预付':'扣费后达到红灯预警，后续订单将暂停扣费'}</span></div></div>`}
function blockedDeduct(id,cur){const o=orderOf(id),a=acctOf(o,cur),unit=cur==='cad'?'CAD':'CNY';show('余额不足 · 禁止扣费',`<h3>${cur==='cad'?'挂号协诊费':'医院预约费用'} · ${id}</h3><div class="callout danger" style="margin-top:16px"><b>红灯预警：余额不足，暂不能扣费。</b><br>${cur==='cad'?o.org+' 的 CAD 预付':'超非凡 CNY 资金池'}余额 ${unit} ${fmt(a.bal)}，本单需扣 ${unit} ${fmt(a.fee)}。请先登记补充的预付款，再回来确认。</div><div style="margin:16px 0">${usebar(a)}<div style="margin-top:6px">${light(a)} <span class="small muted">${lvReason(a,unit)}</span></div></div><div class="casebar">${can('prepaid')?`<button class="primary" onclick="prepaidForm('${cur}'${cur==='cad'?`,'${o.org}'`:''})">＋ ${cur==='cad'?'登记诊所预付':'登记预付款'}</button>`:`<span class="chip denied">${needText('prepaid')}</span>`}${cur==='cad'&&can('fee')?`<button onclick="logEvent('通知诊所补充预付','${o.org}','${id} 余额不足，暂停扣费');closeModal();toast('已记录：通知诊所补充预付（演示）')">通知诊所补款</button>`:''}<button type="button" onclick="detail('${id}')">返回订单详情</button></div>`)}
function warnRule(){return `<div class="warnrule"><span class="lv lv-g"><i></i>使用正常 &lt; 85%</span><span class="lv lv-y"><i></i>黄灯 ≥ 85%</span><span class="lv lv-r"><i></i>红灯 达到 100% / 待扣超出余额</span><span class="small muted">余额不足一单时禁止扣费，需先补款</span></div>`}
function prepaidForm(cur,orgName){if(!can('prepaid')){toast(needText('prepaid'));return}const isCad=cur==='cad';show(isCad?'登记诊所预付':'登记预付款',`<h3>${isCad?orgName+' → 超非凡':'超非凡 → 医院'}</h3><form onsubmit="event.preventDefault();doPrepaid('${cur}','${orgName||''}')"><label>预付金额（${isCad?'CAD':'CNY'}）<input id="ppAmt" type="number" min="1" step="0.01" value="${isCad?1600:30000}" required></label><label>到账日期<input type="date" value="${today()}" required></label><label>依据<textarea required placeholder="如：银行回单编号"></textarea></label><button class="primary">确认登记（演示）</button></form>`)}
function doPrepaid(cur,orgName){const amt=Number(document.getElementById('ppAmt').value)||0,note=noteVal();if(cur==='cad'){orgOf(orgName).cadPrepaid+=amt;logEvent('登记诊所预付',orgName,`CAD ${fmt(amt)} · ${note}`)}else{const id='FIN-'+today().slice(2).replace(/-/g,'')+'-0'+(cnyPrepaid.length+1);cnyPrepaid.push({id,date:today(),amount:amt,who:who().person});logEvent('登记预付款',id,`CNY ${fmt(amt)} · ${note}`);sendPrepayToGc(id,amt)}closeModal();navigate(current);toast(cur==='cad'?'预付已登记，已记入操作记录（演示）':'预支费用已登记并通知瑞金广慈确认到账（演示）')}

/* ========= 通用组件 ========= */
function stat(l,v,sub,unit='',go='',active=false){return `<div class="stat${go?' clickable':''}${active?' active':''}"${go?` role="button" tabindex="0" onclick="${go}" onkeydown="if(event.key==='Enter'){${go}}"`:''}><label>${l}</label><strong>${v}<em>${unit}</em></strong><span>${sub}</span>${go?'<i class="stat-go">›</i>':''}</div>`}
let orderFilter=null;
function ofDef(){if(!orderFilter)return null;const {k,arg}=orderFilter;
  if(k==='status')return ['订单状态：'+arg,o=>o.status===arg];
  if(k==='pay')return ['支付情况：'+arg,o=>payState(o)===arg];
  if(k==='exc')return ['已取消与爽约',isExc];
  if(k==='active')return ['进行中',isActive];
  if(k==='org')return ['诊所：'+arg,o=>o.org===arg];
  if(k==='hosp')return ['医院：'+hospById(arg).name,o=>o.hosp===arg];
  if(k==='id')return ['订单 '+arg,o=>o.id===arg];
  if(k==='mine')return ['我负责的订单',o=>isClinic()?true:o.owner===who().person];
  if(k==='todo')return ['待我处理',o=>canDo(nextAction(o),o)];
  return null}
function ofActive(k,arg){return orderFilter?orderFilter.k===k&&(arg===undefined||orderFilter.arg===arg):k==='all'}
function goOrders(k,arg){closeModal();orderTab='list';orderFilter=k==='all'?null:{k,arg};navigate('orders')}
function flashEl(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function scrollToSec(id){flashEl(document.getElementById(id))}
function goFinance(tab,sec){closeModal();finTab=tab;orderTab='fee';navigate('orders');setTimeout(()=>scrollToSec(sec),60)}
function goAuth(sec){closeModal();navigate('auth');if(sec)setTimeout(()=>scrollToSec(sec),60)}
function openMyLogs(){const r=who();show('我的操作记录',`<p class="muted" style="margin-top:14px">${r.person} · ${r.name}</p>${logList(logs.filter(l=>l.who===r.person),true)}`)}
function heading(k,t,d,a=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div><div class="actions">${a}</div></div>`}
function bottom(text){return `<div class="bottom"><span>${text}</span><span>超非凡业务协同系统　/　原型 ${VER}</span></div>`}
function segbar(items){const total=items.reduce((s,i)=>s+i.count,0)||1;return `<div class="progress-seg">${items.map(i=>i.count?`<div class="seg${i.go?' clickable':''}" style="flex:${i.count} ${i.count} 0%;background:${i.color}"${i.go?` onclick="${i.go}"`:''}></div>`:'').join('')}</div><div class="legend">${items.map(i=>`<span class="legend-item${i.go?' clickable':''}"${i.go?` role="button" tabindex="0" onclick="${i.go}"`:''}><i class="dot" style="color:${i.color}"></i>${i.label} <b>${i.count}</b><small>（${Math.round(i.count/total*100)}%）</small></span>`).join('')}</div>`}
function ring(pct,label,go){const r=42,c=2*Math.PI*r,dash=(pct/100)*c;return `<div class="ring-wrap${go?' clickable':''}"${go?` onclick="${go}"`:''}><svg viewBox="0 0 108 108"><circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--blue)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(c-dash).toFixed(1)}" transform="rotate(-90 54 54)"/></svg><div class="ring-text"><strong>${pct}%</strong><span>${label}</span></div></div>`}
function orgbars(list){const max=Math.max(...list.map(o=>o.count),1);return list.map(o=>`<div class="orgbar-row clickable" onclick="goOrders('org','${o.name}')"><div class="orgbar-label"><span>${o.name}</span><b>${o.count} 笔</b></div><div class="orgbar-track"><div class="orgbar-fill" style="width:${o.count/max*100}%"></div></div></div>`).join('')}
function agendaRow(o){const na=nextAction(o);return `<div class="agenda-row" onclick="detail('${o.id}')"><div class="agenda-date"><strong>${o.cn?o.cn.split(' ')[0]:'待排期'}</strong><span>${o.cn?o.cn.split(' ')[1]:''}</span></div><div class="agenda-body"><b>${o.org} · ${o.dept}</b><span class="muted small">${o.doctor} · ${o.id}</span><span class="agenda-tags"><span class="legend-item"><i class="dot" style="color:${statusColor(payState(o))}"></i>${payState(o)}</span>${na?`<span class="legend-item"><i class="dot" style="color:${na.blk?'var(--red)':'var(--orange)'}"></i>下一步：${na.label}</span>`:''}</span></div>${badge(o.status)}</div>`}
const PAY_COLOR={'未支付':'var(--orange)','海外已支付':'var(--blue)','国内已支付':'var(--green)'};
const ST_COLOR={'已发起':'var(--blue)','待确认':'var(--orange)','已确认':'#5e5ce6','已完成':'var(--green)'};
function authState(g){if(g.stopped)return '账号停止使用';const d=daysLeft(g.expire);return d<0?'已到期':d<=30?'即将到期':'授权使用中'}

/* ========= 路由 ========= */
function navigate(p){
  if(p!=='detail'&&(!labels[p]||!navAllowed(p)))p='dashboard';if(p==='detail'&&!orderOf(DETAIL_ID))p='orders';
  if(p!=='orders')orderFilter=null;
  if(isClinic()&&p==='orders'&&orderTab!=='list')orderTab='list';
  const changed=current!==p;current=p;location.hash=p==='detail'?'orders':p;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  renderNav();document.getElementById('crumb').textContent=p==='detail'?'/　'+navLabel('orders')+'　/　'+DETAIL_ID:'/　'+navLabel(p);if(p==='detail')document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='orders'));
  const pages={detail:orderDetailPage,dashboard:isClinic()?clinicHome:dashboardPage,orders:orderPage,resources:resourcesPage,auth:authPage,reports:reportsPage,issues:issuesPage,settings:settingsPage,profile:profilePage};
  document.getElementById('content').innerHTML=pages[p]();
  renderChrome();applyLang(document.body);labelTables();
  if(changed)document.querySelector('.main').scrollTop=0;if(typeof flRender==='function')flRender()}

/* ========= 工作台 ========= */
function dashboardPage(){
  const all=orders,total=all.length,main=all.filter(o=>!isExc(o));
  const bySt=STATUSES.map(s=>({label:s,count:all.filter(o=>o.status===s).length,color:ST_COLOR[s],go:`goOrders('status','${s}')`})).concat([{label:'取消 / 爽约',count:all.filter(isExc).length,color:'var(--red)',go:"goOrders('exc')"}]);
  const byPay=PAYS.map(s=>({label:s,count:main.filter(o=>payState(o)===s).length,color:PAY_COLOR[s],go:`goOrders('pay','${s}')`}));
  const donePct=Math.round(all.filter(o=>o.status==='已完成').length/Math.max(main.length,1)*100);
  const mine=reminders().filter(r=>can(r.perm));
  const upcoming=all.filter(isActive).sort((a,b)=>(a.cn||'99').localeCompare(b.cn||'99')).slice(0,4);
  const soon=orgs.filter(g=>authState(g)!=='授权使用中');
  const cadBal=orgs.reduce((s,g)=>s+orgBalance(g),0);
  return heading('总览 / DASHBOARD','工作台','订单进度、支付情况与诊所授权一目了然。','<button class="primary" onclick="openGc()">打开瑞金广慈平台 ↗</button>')+cfDataBanner()
  +`<div class="stats">${stat('全部订单',total,`来自 ${orgs.length} 家合作诊所`,'笔',"goOrders('all')")}${stat('进行中',all.filter(isActive).length,'已发起、待确认与已确认','笔',"goOrders('active')")}${stat('待我处理',mine.length,`当前角色：${who().name}`,'项','openReminders()')}${stat('授权临期',soon.length,'30 天内到期或已停用','家',"goAuth('sec-orgs')")}</div>`
  +`<section class="card" style="margin-bottom:16px"><div class="cardhead"><h2>财务概览</h2><small>预付扣费即视为支付 · 金额按币种分别记录</small></div><div class="moneygrid"><div class="clickable" onclick="goFinance('cad','sec-prepaid')"><label>诊所 CAD 预付余额</label><b>${fmt(cadBal)}</b><small>${orgs.length} 家诊所 · 每单挂号协诊费 CAD ${fmt(CAD_FEE)}</small><div class="lvline">${lvChips()}</div></div><div class="clickable" onclick="goFinance('cny','sec-prepaid')"><label>超非凡 CNY 资金池余额</label><b>${fmt(cnyBalance())}</b><small>预付款 ${fmt(cnyTotal())} · 按各医院费用标准支付</small><div class="lvline">${light(acctCny())}<span class="small muted">已用 ${pctTxt(acctCny())}</span></div></div><div><label>支付情况</label>${segbar(byPay)}</div></div></section>`

  ${reqSection(o)}<h3>邮件往来</h3>${mailRows(o)}

/* ========= 授权管理 ========= */
function lastMail(g){return authMails.filter(m=>m.org===g.name).sort((a,b)=>b.at.localeCompare(a.at))[0]}
function addDays(d,n){const t=new Date(Date.parse(d)+n*864e5);return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`}
function nextRemind(g){if(!autoRemind||g.stopped)return null;for(const r of REMIND_RULES){const day=addDays(g.expire,-r);if(daysLeft(day)>0)return {day,kind:r?`到期前 ${r} 天`:'到期当天'};}return null}
function authOrgPage(){
  const list=visOrgs(),st=g=>authState(g);
  const soon=list.filter(g=>st(g)==='即将到期').length,bad=list.filter(g=>['已到期','账号停止使用'].includes(st(g))).length;
  return heading('03 / INSTITUTIONS','机构与账号',isClinic()?'本诊所在医院的账号授权与续期提醒。':'签约海外诊所、确认授权年费，查看各诊所的授权情况，临期自动发邮件提醒诊所办理续期。',can('orgs')?'<button class="primary" id="btnOrgNew" onclick="orgNewForm()">＋ 新增签约诊所</button>':'')

  +(isClinic()?'':`<section class="card"><div class="cardhead"><h2>自动邮件提醒</h2><button class="switch ${autoRemind?'on':''}" role="switch" aria-checked="${autoRemind}" onclick="toggleAuto()"><i></i></button></div><div class="remindrule"><div><label>提醒时间</label><div class="fieldchips">${REMIND_RULES.map(r=>`<span>${r?`到期前 ${r} 天`:'到期当天'}</span>`).join('')}</div></div><div><label>收件人</label><strong>诊所授权联系人</strong><small>抄送 加拿大业务</small></div><div><label>邮件内容</label><strong>授权到期日、续期方式与年费说明</strong><small>诊所续期后，由财务确认年费到账并顺延授权</small></div></div></section>`)

  +`<section class="card sectiongap" id="sec-mails"><div class="cardhead"><h2>提醒邮件记录</h2><small>${authMails.filter(m=>list.some(g=>g.name===m.org)).length} 封</small></div><div style="padding:12px 22px 16px">${authMails.filter(m=>list.some(g=>g.name===m.org)).sort((a,b)=>b.at.localeCompare(a.at)).map(m=>`<div class="todo-row"><div class="todo-main"><span class="todo-ico">✉</span><div><b>授权到期提醒 · ${m.org} ${badge('已发送')}</b><span class="muted small">${m.at} · ${m.kind} · ${m.by}</span></div></div></div>`).join('')||'<p class="muted small">暂无提醒记录</p>'}</div></section>`

  const R=[];

const DEMO_MAIN=15;
function demoStart(){demoStep=0;demoRun()}
function demoGo(n){demoStep=n;demoRun()}
function demoRun(){clearNotes();if(demoStep>=3)demoReceive();DEMO_STEPS[demoStep].run();demoPaint()}
function demoPaint(){const s=DEMO_STEPS[demoStep],pos=s.pos!==undefined?s.pos:demoStep;let p=document.getElementById('demoPanel');if(!p){p=document.createElement('div');p.id='demoPanel';document.body.appendChild(p)}document.querySelector('.app-shell').classList.add('demo-on');
  document.body.classList.toggle('show-gc',s.side==='gc');
  const chip=s.side==='gc'?'<span class="chip s-gc">瑞金广慈</span>':s.side==='cf'?'<span class="chip s-cf">超非凡</span>':'<span class="chip s-cfm">两边联动</span>';
  const nx=s.next!==undefined?s.next:demoStep+1;
  p.innerHTML=`<div class="demo-top"><span class="chip s-cfm">演示</span><span class="small muted">${s.pos!==undefined?'分支':pos+' / '+DEMO_MAIN}</span><button class="link demo-flip" onclick="gcToggle()">切换左右</button><button class="link" onclick="demoExit()">退出演示</button></div><div class="demo-who">${chip}<span>${s.who||''}</span></div><h4>${s.t}</h4><p>${s.d}</p><div class="demo-bar"><i style="width:${Math.min(pos/DEMO_MAIN,1)*100}%"></i></div><div class="demo-btns">${s.alt?`<button onclick="demoGo(${s.alt.to})">${s.alt.label}</button>`:''}${s.last?'<button onclick="demoGo(0)">重新演示</button><button class="primary" onclick="demoExit()">结束</button>':`${demoStep>0?'<button onclick="demoGo(0)">重新开始</button>':''}<button class="primary" onclick="demoGo(${nx})">${demoStep===0?'开始':'下一步'} →</button>`}</div>`;
  applyLang(p)}
function demoExit(){demoStep=-1;const p=document.getElementById('demoPanel');if(p)p.remove();document.querySelector('.app-shell').classList.remove('demo-on');splitOff();hl(null);closeModal();role=(()=>{try{return localStorage.getItem('cf-role')||'ca'}catch(e){return 'ca'}})();if(!ROLES[role])role='ca';navigate(current)}

  document.querySelector('.sidebarfoot').innerHTML=isClinic()?`<strong>${r.person}</strong><br>海外合作诊所 · 诊所视图<br><br><span>原型 ${VER}　/　内部讨论</span>`:`<strong>加拿大超非凡 × 国内超非凡</strong><br>订单 · 资源 · 机构 · 对账<br><br><span>原型 ${VER}　/　内部讨论</span>`}
function show(title,body){const d=document.getElementById('drawer');d.innerHTML=`<div class="drawerhead"><h2>${title}</h2><button aria-label="关闭详情" onclick="closeModal()">✕</button></div>${body}`;document.getElementById('modal').classList.add('open');applyLang(d)}
function closeModal(){document.getElementById('modal').classList.remove('open');renderChrome();applyLang(document.getElementById('topright'));applyLang(document.querySelector('.sidebarfoot'))}

function doHandleReq(id,ok){const r=REQS.find(x=>x.id===id),o=r.order?orderOf(r.order):null,note=noteVal()||(ok?'已处理':'未同意');

  else if(ok&&r.type==='取消'){o.status='已取消';o.cancelReason='诊所申请取消：'+r.reason;if(o.cad==='已扣费')o.cad='待退回';if(o.cny==='待扣费')o.cny='—';gcWrite(o,(b,B)=>{b.status='已取消';b.cancelReason=o.cancelReason;const sl=B.slots.find(x=>x.id===b.slot);if(sl){sl.state='可约';sl.order=null}busFeed(['rj','org:'+b.org],'api','超非凡','预约已取消',`${b.cr||b.id} · ${r.reason}`,b.id)});logEvent('同意取消',o.id,note)}

  logs.push({t:nowStr(),who:'系统自动',role:'系统',act:'邮件通知诊所（中英双语）',target:r.order||r.org,note:`${r.id} 处理结果：${r.result}`});

function shortList(){const L=orgs.filter(g=>!acctCad(g).canDeduct||acctCad(g).lv==='red').map(g=>({who:g.name,cur:'CAD',a:acctCad(g)}));const c=acctCny();if(c.lv==='red')L.push({who:'超非凡',cur:'CNY',a:c});return L}

function urge(id){const o=orderOf(id);o.remindAt=nowStr().slice(5);logEvent('催办医院确认',id,`已邮件提醒 ${o.org} 机构管理员在 ${hospById(o.hosp).name} web 端确认，并抄送医院${hospById(o.hosp).contact}`);navigate(current);toast('催办邮件已发送（演示）')}
function syncFix(id){const x=SYNC_ISSUES.find(y=>y.id===id);show('处理同步异常',`<h3>${x.id} · ${x.kind}</h3><p class="muted">${hospById(x.hosp).name} · ${x.at}</p><div class="callout warn" style="margin-top:12px">${esc(x.detail)}</div><form onsubmit="event.preventDefault();doSyncFix('${id}')"><label>处理方式<select id="sfW">${(x.kind==='数据不一致'?['以医院为准，更新超非凡记录','以超非凡为准，通知医院更正','已人工核对，无需修改']:['已通知医院在其系统中更正','已与医院核对，下次同步更新','忽略此行']).map(v=>`<option>${v}</option>`).join('')}</select></label><label>说明<textarea placeholder="选填"></textarea></label><button class="primary" id="sfGo">确认处理</button></form>`)}
function doSyncFix(id){const x=SYNC_ISSUES.find(y=>y.id===id),w=document.getElementById('sfW').value;x.state='已处理';x.result=w+(noteVal()?'：'+noteVal():'');if(x.order&&w.startsWith('以医院为准')){const o=orderOf(x.order);const m=x.detail.match(/(\d\d-\d\d \d\d:\d\d) 与/);if(m){o.cn=m[1];o.local=cnToEdt(m[1])}}logEvent('处理同步异常',x.order||hospById(x.hosp).name,x.result);closeModal();navigate(current);toast('已处理（演示）')}

/* ---------- 对账报表 ---------- */
function monthOf(o){return '2026-'+(o.recvAt||'').slice(0,2)}
const cadNet=o=>usedOf(o,'cad'),cnyNet=o=>usedOf(o,'cny');
const cadBack=o=>isRefd(o.cad)?CAD_FEE-usedOf(o,'cad'):0,cnyBack=o=>isRefd(o.cny)?cnyFeeOf(o)-usedOf(o,'cny'):0;
const cadPend=o=>o.cad==='待退回'?CAD_FEE:0,cnyPend=o=>o.cny==='待退回'?cnyFeeOf(o):0;
function repOrders(){return orders.filter(o=>!o.demo&&(!repMonth||monthOf(o)===repMonth)&&(!repHosp||o.hosp===repHosp)&&(!repOrg||o.org===repOrg))}
function reportsPage(){const L=repOrders(),S=(a,f)=>a.reduce((t,o)=>t+f(o),0),months=[...new Set(orders.map(monthOf))].sort();
  const done=a=>a.filter(o=>o.status==='已完成').length,exc=a=>a.filter(isExc).length;
  const hrows=HOSP.map(h=>{const a=L.filter(o=>o.hosp===h.id);return {h,a}}).filter(x=>x.a.length||!repHosp);
  const orows=orgs.filter(g=>!repOrg||g.name===repOrg).map(g=>({g,a:L.filter(o=>o.org===g.name)}));
  return heading('04 / RECONCILIATION','对账报表','按月份、医院、诊所统计订单、扣费与退款，可导出对账明细。',`<button class="primary web-only" onclick="exportRecon()">导出对账明细</button>`)
  +`<div class="filters card" style="margin-bottom:16px"><select aria-label="月份" onchange="repMonth=this.value;navigate('reports')"><option value="">全部月份</option>${months.map(m=>`<option ${repMonth===m?'selected':''}>${m}</option>`).join('')}</select><select aria-label="医院" onchange="repHosp=this.value;navigate('reports')"><option value="">全部医院</option>${HOSP.map(h=>`<option value="${h.id}" ${repHosp===h.id?'selected':''}>${h.name}</option>`).join('')}</select><select aria-label="诊所" onchange="repOrg=this.value;navigate('reports')"><option value="">全部诊所</option>${orgs.map(g=>`<option ${repOrg===g.name?'selected':''}>${g.name}</option>`).join('')}</select><button onclick="repMonth='';repHosp='';repOrg='';navigate('reports')">重置</button></div>
  <div class="stats">${stat('订单',L.length,`已完成 ${done(L)} · 取消 / 爽约 ${exc(L)}`,'笔')}${stat('CAD 挂号协诊费',fmt(S(L,cadNet)),`已退回 ${fmt(S(L,cadBack))} · 待退回 ${fmt(S(L,cadPend))}`,'CAD')}${stat('CNY 医院预约费用',fmt(S(L,cnyNet)),`已退回 ${fmt(S(L,cnyBack))} · 待退回 ${fmt(S(L,cnyPend))}`,'CNY')}${stat('完成率',L.length?Math.round(done(L)/L.length*100):0,'已完成 ÷ 全部订单','%')}</div>
  <section class="card"><div class="cardhead"><h2>按医院</h2><small>超非凡支付医院的预约费用（CNY）</small></div><div class="tablewrap"><table><thead><tr><th>医院</th><th>订单</th><th>已完成</th><th>进行中</th><th>取消 / 爽约</th><th>CNY 已付（净额）</th><th>CNY 已退回</th><th>CNY 待退回</th></tr></thead><tbody>${hrows.map(({h,a})=>`<tr><td><strong>${h.name}</strong><small>${h.state} · 每次 CNY ${fmt(h.cny)}</small></td><td>${a.length}</td><td>${done(a)}</td><td>${a.filter(isActive).length}</td><td>${exc(a)}</td><td class="mono">${fmt(S(a,cnyNet))}</td><td class="mono">${fmt(S(a,cnyBack))}</td><td class="mono">${fmt(S(a,cnyPend))}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card sectiongap"><div class="cardhead"><h2>按诊所</h2><small>诊所支付超非凡的挂号协诊费（CAD）</small></div><div class="tablewrap"><table><thead><tr><th>诊所</th><th>订单</th><th>已完成</th><th>取消 / 爽约</th><th>CAD 已扣（净额）</th><th>CAD 已退回</th><th>CAD 待退回</th><th>当前预付余额</th></tr></thead><tbody>${orows.map(({g,a})=>`<tr><td><strong>${g.name}</strong><small>${g.city}</small></td><td>${a.length}</td><td>${done(a)}</td><td>${exc(a)}</td><td class="mono">${fmt(S(a,cadNet))}</td><td class="mono">${fmt(S(a,cadBack))}</td><td class="mono">${fmt(S(a,cadPend))}</td><td class="mono">${fmt(orgBalance(g))}${light(acctCad(g))}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card sectiongap"><div class="cardhead"><h2>逐单明细</h2><small>${L.length} 笔</small></div><div class="tablewrap"><table><thead><tr><th>订单号</th><th>月份</th><th>医院</th><th>诊所</th><th>订单状态</th><th>支付情况</th><th>CAD 净额</th><th>CNY 净额</th></tr></thead><tbody>${L.map(o=>`<tr><td><button class="link mono" onclick="detail('${o.id}')">${o.id}</button><small class="mono">${o.cr||''}</small></td><td>${monthOf(o)}</td><td>${hospOf(o).name}</td><td>${o.org}</td><td>${badge(o.status)}</td><td>${badge(payState(o))}</td><td class="mono">${fmt(cadNet(o))}</td><td class="mono">${fmt(cnyNet(o))}</td></tr>`).join('')||'<tr><td colspan="8" class="emptystate">没有符合条件的订单</td></tr>'}</tbody></table></div></section>`
  +bottom('按接收月份统计；金额为净额（扣费减已退回），待退回单列。')}
function exportRecon(){const L=repOrders(),name='对账明细_'+(repMonth||'全部')+'_'+today().replace(/-/g,'')+'.csv';
  downloadCsv(name,['订单号','医院预约号','月份','医院','诊所','订单状态','支付情况','CAD 净额','CAD 已退回','CNY 净额','CNY 已退回'],L.map(o=>[o.id,o.cr||'',monthOf(o),hospOf(o).name,o.org,o.status,payState(o),cadNet(o),cadBack(o),cnyNet(o),cnyBack(o)]));

  return `<section class="card sectiongap" id="sec-settle"><div class="cardhead"><h2>待结算（会诊已完成）</h2>${L.length&&can('pay')?`<button class="primary web-only" onclick="batchSettle()">批量结算 ${L.length} 笔</button>`:''}</div><div class="callout" style="margin:14px 20px 0">资金池模式：医院预约费用在会诊完成后从 CNY 资金池结算，不逐单通知医院。已接入的瑞金广慈按上方「医院账单」整单清账；其他医院在这里逐单结算。</div><div class="tablewrap"><table><thead><tr><th>订单号 / 诊所</th><th>医院</th><th>会诊完成</th><th>应结算</th><th>操作</th></tr></thead><tbody>${L.map(o=>`<tr><td><strong class="mono">${o.id}</strong><small>${o.org}</small></td><td>${hospOf(o).name}</td><td class="mono">${stamp(o.doneAt)}</td><td class="mono">${dual('CNY',cnyFeeOf(o))}</td><td>${can('pay')?`<button class="link" onclick="openPay('${o.id}')">结算</button>`:denied('pay')}</td></tr>`).join('')||'<tr><td colspan="5" class="emptystate">没有待结算的订单</td></tr>'}</tbody></table></div>${L.length?`<div class="tablefoot"><span>合计 ${dual('CNY',sum)}</span></div>`:''}</section>`}
function batchSettle(){if(!can('pay')){toast(needText('pay'));return}const L=settleList();let n=0,sum=0;for(const o of L){if(!acctOf(o,'cny').canDeduct)break;o.cny='已扣费';o.payAt=nowStr().slice(5);n++;sum+=cnyFeeOf(o)}
  logEvent('批量结算医院预约费用','资金池',`${n} 笔 · ${dual('CNY',sum)}`);navigate(current);toast(n<L.length?`已结算 ${n} 笔，资金池余额不足，其余暂停（演示）`:`已结算 ${n} 笔，合计 CNY ${fmt(sum)}（演示）`)}
function hospBars(){const max=Math.max(...HOSP.map(h=>orders.filter(o=>o.hosp===h.id).length),1);return HOSP.map(h=>{const n=orders.filter(o=>o.hosp===h.id).length;return `<div class="orgbar-row clickable" onclick="goOrders('hosp','${h.id}')"><div class="orgbar-label"><span>${h.name} ${badge(h.state)}</span><b>${n} 笔</b></div><div class="orgbar-track"><div class="orgbar-fill" style="width:${n/max*100}%"></div></div></div>`}).join('')}

function trText(s){
  if(!/[㐀-鿿　-〿＀-￯]/.test(s))return s;
  const k=s.trim();if(EN_EXACT[k]!==undefined)return s.replace(k,EN_EXACT[k]);
  let out=s;for(const [re,rep] of EN_RE)out=out.replace(re,rep);
  for(const [zh,en] of EN_PH)if(out.includes(zh))out=out.split(zh).join(en);
  return out.replace(/，/g,', ').replace(/。/g,'. ').replace(/：/g,': ').replace(/；/g,'; ').replace(/（/g,' (').replace(/）/g,')').replace(/、/g,', ').replace(/　/g,' ').replace(/？/g,'?').replace(/！/g,'!').replace(/＋/g,'+').replace(/ {2,}/g,' ').replace(/\( /g,'(').replace(/ \)/g,')')}
function applyLang(root){
  if(!root)return;
  if(lang!=='en')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.parentNode&&/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName))continue;if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('#flDrawer,#flTab'))continue;const v=n.nodeValue;if(!/[㐀-鿿　-〿＀-￯]/.test(v))continue;if(n.__zh===undefined)n.__zh=v;n.nodeValue=trText(v)}
  root.querySelectorAll&&root.querySelectorAll('[placeholder],[aria-label]').forEach(el=>{['placeholder','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v&&/[㐀-鿿]/.test(v)){if(!el.dataset['zh'+a.replace('-','')])el.dataset['zh'+a.replace('-','')]=v;el.setAttribute(a,trText(v))}})})}
function restoreZh(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))if(n.__zh!==undefined){n.nodeValue=n.__zh;delete n.__zh}root.querySelectorAll('[data-zhplaceholder],[data-zharialabel]').forEach(el=>{if(el.dataset.zhplaceholder){el.setAttribute('placeholder',el.dataset.zhplaceholder);delete el.dataset.zhplaceholder}if(el.dataset.zharialabel){el.setAttribute('aria-label',el.dataset.zharialabel);delete el.dataset.zharialabel}})}
function setLang(l){lang=l;try{localStorage.setItem('cf-lang',l)}catch(e){}document.documentElement.lang=l==='en'?'en':'zh-CN';document.title=l==='en'?'Chaofeifan · Collaboration Prototype':'超非凡 · 业务协同原型';restoreZh(document.body);const open=document.getElementById('modal').classList.contains('open');if(open)closeModal();navigate(current);applyLang(document.body);if(demoStep>=0){demoPaint();return}toast(l==='en'?'Switched to English':'已切换为简体中文')}

const CF_LOCK='CF_LEADER_V11',CF_TAB=(()=>{let t=null;try{t=sessionStorage.getItem('cf_tab')}catch(e){}if(!t){t=Math.random().toString(36).slice(2);try{sessionStorage.setItem('cf_tab',t)}catch(e){}}return t})();

function cfClaim(force){const l=cfLock();if(!(force||!l||l.id===CF_TAB||Date.now()-l.t>4000))return;const takeover=l&&l.id!==CF_TAB;if(takeover){try{cfRestore()}catch(e){}}const was=cfIsLeader();try{localStorage.setItem(CF_LOCK,JSON.stringify({id:CF_TAB,t:Date.now()}))}catch(e){}if(!was&&CF_READY){try{cfSync();if(document.getElementById('content')&&!document.body.classList.contains('cf-logged-out'))navigate(current)}catch(e){}}}

function cfSync(){busLoad();if(!cfIsLeader())return;const W=[];

  if(JSON.stringify(pub)!==JSON.stringify(BUS.cfOrgs))W.push(B=>{B.cfOrgs=pub});
  /* 2. 「从零演示」场景：去掉医院系统里不存在的瑞金示例订单 */
  if(BUS.scenario==='blank'){for(let i=orders.length-1;i>=0;i--){const o=orders[i];if(o.hosp==='rj'&&!BUS.orders.some(b=>b.id===(o.gcId||busXq(o.id))||b.cfId===o.id))orders.splice(i,1)}
    for(let i=REQS.length-1;i>=0;i--)if(REQS[i].order&&!orderOf(REQS[i].order))REQS.splice(i,1);
    for(let i=SYNC_ISSUES.length-1;i>=0;i--)if(SYNC_ISSUES[i].order&&!orderOf(SYNC_ISSUES[i].order))SYNC_ISSUES.splice(i,1)}
  /* 3. 按医院系统的需求单更新超非凡订单 */
  BUS.orders.forEach(b=>{if(b.via==='direct')return;let o=orders.find(x=>x.gcId===b.id||x.id===b.cfId||(x.hosp==='rj'&&busXq(x.id)===b.id));

      logs.push({t:nowStr(),who:'医院同步',role:'系统',act:'接收预约信息',target:id,note:`${b.id} · ${b.dept} / ${b.expert} · 中国时间 ${b.cn} · 创建人 ${b.creator}（GC-04）`});

    o.gcId=b.id;if(b.cfId!==o.id)W.push(B=>{const x=B.orders.find(y=>y.id===b.id);if(x)x.cfId=o.id});
    if(b.want)o.want=b.want;
    if(b.cn!==o.cn){const pv=o.cn;o.cn=b.cn;o.local=b.cn?cnToEdt(b.cn):'';if(b.cn)sysLog(pv?'医院调整会诊时间':'医院排定会诊时间',o.id,`中国 ${b.cn} CST · 当地 ${o.local} ${o.zone}${pv?' · 原 '+pv:''} · 待机构在瑞金广慈确认（GC-26）`);else if(pv)sysLog('会诊时间待重新排期',o.id,`原时间 中国 ${pv}${b.timeBack?' · 机构退回：'+b.timeBack.reason:''}`)}

    if(b.billId){const bl0=BUS.bills.find(x=>x.id===b.billId);if(bl0&&bl0.state==='已清账'&&!o.clearSynced){o.clearSynced=true;sysLog('医院清账确认',o.id,`账单 ${bl0.id} 已清账，医院预约费用结算完成`)}o.billId=b.billId;const bl=BUS.bills.find(x=>x.id===b.billId);if(bl&&['已支付','已清账'].includes(bl.state)&&o.cny==='待扣费'){o.cny='已扣费';o.payAt=(bl.paidAt||busNow()).slice(5,16)}}});
  /* 4. 机构在瑞金广慈提交的改期 / 取消申请 → 异常中心 · 诊所申请 */
  (BUS.reqs||[]).forEach(r=>{if(REQS.some(x=>x.gcReq===r.id))return;const o=orders.find(x=>x.gcId===r.xq);if(!o)return;
    REQS.unshift({id:r.id,order:o.id,org:r.org,type:r.type,want:r.want,slot:r.slot,reason:r.reason+'（瑞金广慈 · '+r.by+'）',at:r.at.slice(5,16),state:r.state==='待处理'?'待处理':'已处理',gcReq:r.id})});
  /* 5. 专业资源库：瑞金专家号源以医院系统为准（只读） */
  const BX=new Set(BUS.experts.filter(e=>busHospLive(busHosp(e.hosp))).map(e=>e.id));for(let i=SLOTS.length-1;i>=0;i--)if(BX.has(SLOTS[i].ex))SLOTS.splice(i,1);
  BUS.slots.forEach(s=>{if(BX.has(s.ex))SLOTS.push({ex:s.ex,date:s.date,time:s.time,state:s.state})});
  BUS.experts.forEach(e=>{const x=EXPERTS.find(y=>y.id===e.id);if(x)x.state=e.state});
  if(W.length&&cfWriteOk())busUpdate(B=>W.forEach(w=>w(B)));cfSave()}

function cfSave(){if(typeof BUS_RELOADING!=='undefined'&&BUS_RELOADING)return;if(!cfIsLeader())return;try{if(localStorage.getItem(BUS_KEY+'_RESET')!==CF_RESET0)return}catch(e){}try{localStorage.setItem(CF_KEY,JSON.stringify({v:11,orders,orgs,logs,REQS,SYNC_ISSUES,cnyPrepaid,USERS,ORG_HOSP,authMails,clinic:ROLES.clinic.org}))}catch(e){}}
function cfRestore(){let x=null;try{x=JSON.parse(localStorage.getItem(CF_KEY)||'null')}catch(e){}if(!x||x.v!==11)return;
  const put=(arr,v)=>{if(Array.isArray(v))arr.splice(0,arr.length,...v)};put(orders,x.orders);put(orgs,x.orgs);put(logs,x.logs);put(REQS,x.REQS);put(SYNC_ISSUES,x.SYNC_ISSUES);put(cnyPrepaid,x.cnyPrepaid);put(USERS,x.USERS);put(authMails,x.authMails);
  if(x.ORG_HOSP)Object.assign(ORG_HOSP,x.ORG_HOSP);if(x.clinic&&orgOf(x.clinic))Object.assign(ROLES.clinic,{org:x.clinic,person:x.clinic,av:x.clinic.slice(0,1)})}

/* ================================================================
   v1.1 状态同步：超非凡订单显示瑞金广慈的实时状态（待医院排期 / 待机构确认 等）；

function gcStatusOf(o){const b=o&&o.gcId&&BUS.orders.find(x=>x.id===o.gcId);return b?b.status:null}
function consultOf(o){const gs=gcStatusOf(o);if(gs&&['待超非凡确认','待医院排期','待机构确认','待医院确认'].includes(gs))return gs;if(!o.gcAt)return null;if(o.status==='已完成')return '已完成';if(o.status==='爽约')return '爽约';if(o.status==='已取消')return '已取消';if(gs&&['待签到','已签到','会诊中','待小结'].includes(gs))return gs;return o.consult||'待签到'}
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;try{busLoad();if(cfIsLeader())cfSync();else cfRestore();if(document.getElementById('content')&&!document.body.classList.contains('cf-logged-out'))navigate(current);else if(typeof flRender==='function')flRender()}catch(e){}});

/* ================================================================
   v0.9 资金池结算医院预约费用：财务逐笔核对 → 资金池扣款 → 结算确认（或退回医院重新出账）
   ================================================================ */
const BILL_STEP={'待支付':'待财务结算确认','已支付':'已结算，待医院清账','已清账':'结算完成','已退回':'已退回医院'};
function hospBillSec(){const L=[...BUS.bills].reverse(),pend=L.filter(b=>b.state==='待支付');
  return `<section class="card sectiongap" id="sec-hbill"><div class="cardhead"><h2>医院账单 · 资金池结算</h2><small>医院按期出账 → 财务逐笔核对 → 从 CNY 资金池结算确认 → 医院清账确认</small></div>
  ${pend.length?`<div class="callout warn" style="margin:14px 20px 0">有 ${pend.length} 张医院账单待财务结算确认，合计 ${dual('CNY',pend.reduce((t,b)=>t+b.amount,0))}。</div>`:''}
  <div class="tablewrap"><table><thead><tr><th>账单号</th><th>账期</th><th>笔数</th><th>金额</th><th>结算进度</th><th>时间</th><th>操作</th></tr></thead><tbody>${L.map(b=>`<tr><td><strong class="mono">${b.id}</strong></td><td>${b.period}</td><td>${b.orders.length}</td><td class="mono">${dual('CNY',b.amount)}</td><td>${badge(b.state)}<small>${BILL_STEP[b.state]||''}${b.settle?' · '+b.settle.by:''}</small></td><td><small>出账 ${b.createdAt.slice(5)}${b.paidAt?' · 结算 '+b.paidAt.slice(5):''}${b.clearedAt?' · 清账 '+b.clearedAt.slice(5):''}${b.returnAt?' · 退回 '+b.returnAt.slice(5):''}</small></td><td>${b.state==='待支付'&&can('pay')?`<button class="primary" id="hb-${b.id}" onclick="hospBillForm('${b.id}')">核对并结算确认</button>`:`<button class="link" onclick="hospBillForm('${b.id}')">明细</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="emptystate">暂无医院账单（会诊完成后由医院按期出账）</td></tr>'}</tbody></table></div></section>`+poolLedger()}
function billLines(b){return b.orders.map(x=>{const g=BUS.orders.find(y=>y.id===x)||{},o=orders.find(y=>y.gcId===x)||{},std=o.id?cnyFeeOf(o):g.fee;const chk=[['会诊已完成',g.status==='已完成'],['金额与费用标准一致',g.fee===std],['订单已对应',!!o.id],['无退款 / 爽约冲突',!['爽约','已取消','已停诊'].includes(g.status)]];return {g,o,std,chk,ok:chk.every(c=>c[1])}})}
function hospBillForm(id){const b=BUS.bills.find(x=>x.id===id),a=acctCny(),L=billLines(b),pend=b.state==='待支付'&&can('pay'),need=billNeed(b);
  const after=a.bal-need,na=acct(a.pre,a.used+need,Math.max(a.pend-need,0),0);
  show('医院账单 · '+b.id,`<h3>${b.period} · 瑞金广慈平台出账</h3><div class="kvgrid"><div><label>账单金额</label><strong>${dual('CNY',b.amount)}</strong></div><div><label>笔数</label><strong>${b.orders.length}</strong></div><div><label>出账时间</label><strong>${b.createdAt}</strong></div><div><label>结算进度</label><strong>${badge(b.state)} ${BILL_STEP[b.state]||''}</strong></div></div>
  <h3>① 逐笔核对</h3><div class="tablewrap"><table><thead><tr>${pend?'<th><input type="checkbox" id="hbAll" onchange="document.querySelectorAll(\'.hbLine:not(:disabled)\').forEach(x=>x.checked=this.checked);hbCheck()"></th>':''}<th>会诊编号 / 订单</th><th>诊所 · 医院 / 专家</th><th>会诊完成</th><th>账单金额 / 费用标准</th><th>系统校验</th></tr></thead><tbody>${L.map((r,k)=>`<tr>${pend?`<td><input type="checkbox" class="hbLine" ${r.ok?'':'disabled'} onchange="hbCheck()"></td>`:''}<td><strong class="mono">${r.g.cr||r.g.id}</strong><small class="mono">${r.o.id||'—'}</small></td><td>${r.g.org||''}<small>${hospById(r.g.hosp||'rj').name} · ${r.g.dept||''} / ${r.g.expert||''}</small></td><td class="mono">${(r.g.doneAt||'').slice(5)}</td><td class="mono">CNY ${fmt(r.g.fee)}<small>标准 CNY ${fmt(r.std)}</small>${r.g.cfSettle?`<small style="color:var(--green)">已逐单结算 · ${r.g.cfSettle.voucher}</small>`:''}</td><td>${r.chk.map(c=>`<small style="color:${c[1]?'var(--green)':'var(--red)'}">${c[1]?'✓':'✕'} ${c[0]}</small>`).join('')}</td></tr>`).join('')}</tbody></table></div>
  <h3>② 资金池扣款</h3><div class="acctmini ${after<0?'callout danger':na.lv==='yellow'?'callout warn':''}"><div class="kvgrid"><div><label>CNY 资金池余额</label><strong>CNY ${fmt(a.bal)}</strong></div><div><label>本次扣款</label><strong>CNY ${fmt(need)}</strong>${need<b.amount?`<small>其中 CNY ${fmt(b.amount-need)} 已逐单结算，只做对账</small>`:''}</div><div><label>结算后余额</label><strong class="${after<0?'redtext':''}">CNY ${fmt(after)}</strong></div><div><label>预警</label><strong>${after<0?'<span class="lv lv-r"><i></i>余额不足</span>':light(na)}</strong></div></div>${after<0&&can('prepaid')?`<button onclick="prepaidForm('cny')">＋ 登记预支费用</button>`:''}</div>
  ${b.settle?`<h3>结算记录</h3><div class="kvgrid"><div><label>结算人</label><strong>${b.settle.by}</strong></div><div><label>结算日期</label><strong>${b.settle.date}</strong></div><div><label>凭证号</label><strong class="mono">${b.settle.voucher}</strong></div><div><label>说明</label><strong>${b.settle.note||'—'}</strong></div></div>`:''}
  ${b.returnReason?`<div class="callout warn">已退回医院：${b.returnReason}（${b.returnAt}）</div>`:''}
  ${pend?`<h3>③ 结算确认</h3><form onsubmit="event.preventDefault();payHospBill('${id}')"><div class="kvgrid"><div><label>结算日期<input type="date" id="hbDate" value="${today()}" required></label></div><div><label>付款凭证号<input id="hbVoucher" required placeholder="如：资金池划扣单 ZJC-${today().replace(/-/g,'')}-01" value="ZJC-${today().replace(/-/g,'')}-01"></label></div></div><label>核对说明<textarea id="hbNote" placeholder="如：与订单逐笔核对无误">逐笔核对无误，金额与费用标准一致。</textarea></label>
  <label class="chk"><input type="checkbox" id="hbOk" onchange="hbCheck()"><div><b>我已逐笔核对，确认从 CNY 资金池结算医院预约费用</b><span>结算后订单支付状态变为「国内已支付」，通知瑞金广慈清账确认（CAD / CNY 双币种）。经办人：${who().person}（${who().name}）</span></div></label>
  <div class="casebar"><button class="primary" id="hbGo" disabled>确认结算（财务）</button><button type="button" onclick="document.getElementById('hbRet').style.display='block'">有问题，退回医院重新出账</button></div>
  <div id="hbRet" style="display:none" class="callout warn"><label>退回原因<textarea id="hbRetText" placeholder="如：XQ… 会诊费用与标准不符">账单中有订单金额与费用标准不一致，请核对后重新出账。</textarea></label><button type="button" class="danger-btn" onclick="returnBill('${id}')">确认退回</button></div></form>`:(b.state==='待支付'?`<p class="small muted">${needText('pay')}</p>`:'')}`);hbCheck()}
function hbCheck(){const go=document.getElementById('hbGo');if(!go)return;const L=[...document.querySelectorAll('.hbLine')];go.disabled=!(L.length&&L.every(x=>x.checked)&&document.getElementById('hbOk').checked&&acctCny().bal>=0)}
function payHospBill(id){const b=BUS.bills.find(x=>x.id===id);if(!b||b.state!=='待支付')return;const L=[...document.querySelectorAll('.hbLine')];if(L.length&&!L.every(x=>x.checked)){toast('请逐笔核对');return}const need=billNeed(b);if(acctCny().bal<need){toast('CNY 资金池余额不足，请先登记预支费用');return}
  const v=k=>(document.getElementById(k)||{}).value||'',st={by:who().person,date:v('hbDate')||today(),voucher:v('hbVoucher'),note:v('hbNote'),deducted:need,balAfter:acctCny().bal-need};
  busUpdate(B=>{const x=B.bills.find(y=>y.id===id);x.state='已支付';x.paidAt=busNow();x.settle=st;busFeed(['rj','channel'],'bill','超非凡',`财务已结算确认 · ${x.id}`,`${dual('CNY',x.amount)} · 凭证 ${st.voucher}，请清账确认`)});
  logEvent('资金池结算医院账单',id,`${dual('CNY',b.amount)} · 凭证 ${st.voucher} · ${st.note}`);cfSync();
  b.orders.forEach(x=>{const o=orders.find(y=>y.gcId===x);if(o&&!o.cnySettle)logs.push({t:nowStr(),who:who().person,role:who().name,act:'资金池结算医院预约费用',target:o.id,note:`账单 ${id} · CNY ${fmt(cnyFeeOf(o))} · 国内已支付`})});
  closeModal();navigate(current);toast('已结算确认，等待医院清账（演示）')}
function returnBill(id){const r=(document.getElementById('hbRetText').value||'').trim();if(!r){toast('请填写退回原因');return}
  busUpdate(B=>{const x=B.bills.find(y=>y.id===id);x.state='已退回';x.returnAt=busNow();x.returnReason=r;B.orders.forEach(o=>{if(o.billId===id)delete o.billId});busFeed(['rj','channel'],'bill','超非凡',`账单已退回 · ${x.id}`,`原因：${r}。请核对后重新出账`)});
  logEvent('退回医院账单',id,r);cfSync();closeModal();navigate(current);toast('账单已退回医院（演示）')}
/* 资金池流水 */
function poolLedger(){const E=[{t:'2026-08-31',kind:'历史',txt:'8 月及以前已结算医院费用',amt:-CNY_HIST}];
  cnyPrepaid.forEach(p=>E.push({t:p.date,kind:'入账',txt:`预支费用 ${p.id}${p.busId?' · 医院'+prepayGcState(p):''}`,amt:p.amount}));
  BUS.bills.filter(b=>b.paidAt).forEach(b=>{const d=b.settle&&b.settle.deducted!=null?b.settle.deducted:b.amount;E.push({t:b.paidAt.slice(0,16),kind:d?'结算':'对账',txt:`医院账单 ${b.id} · ${b.orders.length} 笔${b.settle?' · 凭证 '+b.settle.voucher:''}${d<b.amount?' · 其中 CNY '+fmt(b.amount-d)+' 已逐单结算':''}${b.state==='已清账'?' · 医院已清账':''}`,amt:-d})});
  orders.filter(o=>o.gcId&&o.cnySettle).forEach(o=>E.push({t:o.cnySettle.at.slice(0,16),kind:'结算',txt:`逐单结算 ${o.id}${o.cr?' · '+o.cr:''} · 凭证 ${o.cnySettle.voucher}`,amt:-o.cnySettle.amount}));
  orders.filter(o=>!o.gcId&&o.cny==='已扣费'&&o.payAt).forEach(o=>E.push({t:'2026-'+o.payAt.slice(0,5),kind:'结算',txt:`逐单结算 ${o.id}`,amt:-cnyFeeOf(o)}));
  E.sort((a,b)=>a.t.localeCompare(b.t));let bal=0;E.forEach(e=>{bal+=e.amt;e.bal=bal});
  return `<section class="card sectiongap" id="sec-pool"><div class="cardhead"><h2>CNY 资金池流水</h2><small>入账（预支费用）与结算扣款，余额实时计算</small></div><div class="tablewrap"><table><thead><tr><th>日期</th><th>类型</th><th>摘要</th><th>金额 CNY</th><th>余额 CNY</th></tr></thead><tbody>${E.reverse().map(e=>`<tr><td class="mono">${e.t}</td><td>${badge(e.kind==='入账'?'入账':e.kind==='结算'?'结算扣款':e.kind==='对账'?'对账':'历史')}</td><td>${e.txt}</td><td class="mono" style="color:${e.amt>0?'var(--green)':'inherit'}">${e.amt>0?'+':''}${fmt(e.amt)}</td><td class="mono"><strong>${fmt(e.bal)}</strong></td></tr>`).join('')}</tbody></table></div></section>`}

/* ---------- 逐单结算确认：会诊完成后财务直接从资金池结算，医院按期出账时只做对账 ---------- */
function orderSettleForm(id){if(!can('pay')){toast(needText('pay'));return}const o=orderOf(id),g=o.gcId&&BUS.orders.find(x=>x.id===o.gcId)||{},fee=cnyFeeOf(o),a=acctCny(o),after=a.bal-fee,na=acct(a.pre,a.used+fee,Math.max(a.pend-fee,0),0);
  const chk=[['会诊已完成',o.status==='已完成'],['会诊小结已提交',!g.sm||!!g.sm.submitAt],['机构已查收小结',!g.sm||!!(g.receipt&&g.receipt.state==='已查收')],['金额与医院费用标准一致',!g.fee||g.fee===fee]];
  show('资金池结算确认',`<h3>${o.id}${o.cr?' · '+o.cr:''}</h3><p class="muted">${o.org} · ${hospOf(o).name} · ${o.dept} / ${o.doctor} · 会诊完成 ${o.doneAt||'—'}</p>
  <h3>① 结算核对</h3><div class="todo-list">${chk.map(c=>`<div class="todo-row"><div class="todo-main"><span class="todo-ico${c[1]?'':' warnico'}">${c[1]?'✓':'!'}</span><div><b>${c[0]}</b></div></div></div>`).join('')}</div>
  <h3>② 资金池扣款</h3><div class="acctmini ${after<0?'callout danger':na.lv==='yellow'?'callout warn':''}"><div class="kvgrid"><div><label>CNY 资金池余额</label><strong>CNY ${fmt(a.bal)}</strong></div><div><label>本单医院预约费用</label><strong>${dual('CNY',fee)}</strong></div><div><label>结算后余额</label><strong class="${after<0?'redtext':''}">CNY ${fmt(after)}</strong></div><div><label>预警</label><strong>${after<0?'<span class="lv lv-r"><i></i>余额不足</span>':light(na)}</strong></div></div>${after<0&&can('prepaid')?`<button onclick="prepaidForm('cny')">＋ 登记预支费用</button>`:''}</div>
  <h3>③ 结算确认</h3><form onsubmit="event.preventDefault();doOrderSettle('${id}')"><div class="kvgrid"><div><label>结算日期<input type="date" id="osDate" value="${today()}" required></label></div><div><label>付款凭证号<input id="osVoucher" required value="ZJC-${today().replace(/-/g,'')}-${o.id.slice(-3)}"></label></div></div><label>说明<textarea id="osNote">会诊已完成，按医院费用标准从资金池结算。</textarea></label>
  <label class="chk"><input type="checkbox" id="osOk" required><div><b>确认从 CNY 资金池结算本单医院预约费用</b><span>结算后支付情况变为「国内已支付」，同步瑞金广慈；医院按期出账时该单只做对账，不重复扣款。经办人：${who().person}（${who().name}）</span></div></label>
  <div class="casebar"><button class="primary" id="osGo" ${after<0||!chk[0][1]?'disabled':''}>确认结算（财务）</button><button type="button" onclick="detail('${id}')">返回订单详情</button></div></form>`)}
function doOrderSettle(id){const o=orderOf(id),fee=cnyFeeOf(o);if(o.cny!=='待扣费')return;if(acctCny(o).bal<fee){toast('CNY 资金池余额不足，请先登记预支费用');return}const v=k=>(document.getElementById(k)||{}).value||'';
  const st={at:busNow(),by:who().person,date:v('osDate')||today(),voucher:v('osVoucher'),note:v('osNote'),amount:fee};
  o.cny='已扣费';o.payAt=nowStr().slice(5);o.cnySettle=st;logEvent('资金池结算医院预约费用（逐单）',id,`${dual('CNY',fee)} · 凭证 ${st.voucher} · ${st.note}`);

  const gcBox=b&&!isClinic()?kv([['医院需求单状态',badge(b.status)],['陪诊医生',b.escort||'待机构分配'],['签到',b.checkinAt?stamp(b.checkinAt):'—'],['会诊时长',b.duration||'—'],['会诊小结',b.sm&&b.sm.submitAt?'已提交 '+stamp(b.sm.submitAt):b.status==='待小结'?'专家撰写中':'—'],['机构查收',b.receipt?b.receipt.state:'—']])+`<button class="link" onclick="openGc()">打开瑞金广慈平台 ↗</button>`:'';
  return `<div class="dhead"><button class="dback" onclick="detailBack()">← ${tt('返回','Back')}</button><div class="dtitle"><span class="eyebrow">订单详情 / ORDER</span><h1 class="mono">${o.id}</h1><div class="badgeline">${badge(o.status)}${badge(payState(o))}${o.cr?`<span class="small muted mono">医院预约号 ${o.cr}</span>`:''}</div></div><div class="dacts">${isClinic()?reqBtn(o):''}</div></div>
  <section class="card dcard"><div class="dcard-b">${tracker(o)}${note}${nextBox}</div></section>
  <div class="dgrid"><div class="dmain">
    ${dCard('订单进度',`<div class="flow-legend"><span class="chip s-sync">医院同步</span><span class="chip s-manual">手动确认</span><span class="chip s-mail">邮件</span><span class="chip s-clinic">诊所确认</span><span class="chip s-cfm">回传医院</span></div>${flowStages(o)}`)}
    ${dCard('医院会诊',consultPanel(o))}
    ${dCard('邮件往来',mailRows(o))}
    ${dCard('操作记录',logList(clinicSafe(logs.filter(l=>l.target===o.id))))}
  </div><div class="dside">
    ${dCard('预约信息',info)}
    ${dCard('费用与结算',fee)}
    ${gcBox?dCard('瑞金广慈同步',gcBox):''}
    ${reqSection(o)?dCard('诊所申请',reqSection(o).replace(/^<h3>[^<]*<\/h3>/,'')):''}
  </div></div>`+bottom('订单详情 · 会诊时间由瑞金广慈排定、机构确认 · 操作表单以完整页面打开')}

if(window.self!==window.top)document.body.classList.add('embedded');
